<svg xmlns="http://www.w3.org/2000/svg" width="592" height="230" viewBox="0 0 592 230" role="img" aria-labelledby="t d">
<title id="t">Example host: one topology domain with 4 cores, 2 threads each</title><desc id="d">Thread 0 of cores 0 to 3 is CPUs 0 to 3; thread 1 is CPUs 4 to 7. All 8 CPUs form one topology domain.</desc>
