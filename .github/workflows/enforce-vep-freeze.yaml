name: Enforce VEP Freeze

on:
  pull_request:
    paths:
      - 'veps/**/*.md'
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: enforce-vep-freeze-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: List changed VEP files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' \
            | grep -E '^veps/.*\.md$' > changed_files.txt || true
          cat changed_files.txt

      - name: Enforce VEP Freeze
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: python3 .github/scripts/enforce_vep_freeze.py changed_files.txt
