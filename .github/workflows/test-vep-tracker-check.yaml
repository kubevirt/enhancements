name: Test VEP tracker check

on:
  pull_request:
    paths:
      - '.github/scripts/vep_tracker_check.py'
      - '.github/scripts/vep_tracker_check_test.py'
      - '.github/workflows/test-vep-tracker-check.yaml'
      - '.github/workflows/vep-tracker-check.yaml'

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s .github/scripts -p '*_test.py'
